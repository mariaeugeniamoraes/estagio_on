
{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir vaga | EstágioON</title>
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>
<body>

<header class="cabecalho">
    <nav class="navegacao container">
        <a href="{% url 'home' %}" class="logo">
            Estágio<span>ON</span>
        </a>
    </nav>
</header>

<main class="perfil-container container">
    <div class="perfil-card">

        <h1>Excluir vaga</h1>

        <p>
            Tem certeza de que deseja excluir a vaga
            <strong>{{ vaga.titulo }}</strong>?
        </p>

        <p>
            Essa ação não poderá ser desfeita.
        </p>

        <form method="post" class="editar-perfil-form">
            {% csrf_token %}

            <div class="editar-perfil-acoes">
                <a href="{% url 'minhas_vagas' %}"
                   class="botao-cancelar">
                    Cancelar
                </a>

                <button type="submit" class="botao-excluir">
                    Sim, excluir vaga
                </button>
            </div>
        </form>

    </div>
</main>

</body>
</html>
